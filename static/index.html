<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ByteSweep - Server Monitor</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css" />
    <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-web-links@0.11.0/lib/addon-web-links.js"></script>
    <style>
        :root {
            --bg-primary: #0f1419;
            --bg-secondary: #1a1f2e;
            --bg-card: #232a3b;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.3);
            --text-primary: #e4e8f1;
            --text-secondary: #8899a8;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --border: rgba(255,255,255,0.08);
            --radius: 12px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }
        .dashboard {
            max-width: 1600px;
            margin: 0 auto;
            padding: 24px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 12px;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 600;
            background: linear-gradient(135deg, var(--accent), #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-info {
            display: flex;
            gap: 24px;
            align-items: center;
            flex-wrap: wrap;
        }
        .server-name {
            font-size: 14px;
            color: var(--text-secondary);
        }
        .uptime-badge {
            background: var(--bg-card);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }
        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .btn:hover { border-color: var(--accent); background: var(--bg-secondary); }
        .btn-danger { color: var(--danger); border-color: var(--danger); }
        .btn-danger:hover { background: var(--danger); color: white; }
        .btn-success { color: var(--success); border-color: var(--success); }
        .btn-success:hover { background: var(--success); color: white; }
        .btn-accent { background: var(--accent); color: white; border: none; }
        .btn-accent:hover { opacity: 0.9; }
        .btn-sm { padding: 4px 10px; font-size: 11px; border-radius: 6px; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; pointer-events: none; }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .stat-card:hover {
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
            transform: translateY(-2px);
        }
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), transparent);
        }
        .stat-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
        }
        .stat-detail {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
            margin-bottom: 32px;
        }
        .chart-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
        }
        .chart-card h3 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-secondary);
        }
        .chart-container {
            position: relative;
            height: 160px;
        }
        .charts-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 32px;
        }

        .info-section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 24px;
        }
        .info-section h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-primary);
        }

        .disk-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }
        .disk-item {
            background: var(--bg-secondary);
            border-radius: 8px;
            padding: 16px;
        }
        .disk-name { font-size: 13px; font-weight: 600; margin-bottom: 6px; }
        .disk-mount { font-size: 11px; color: var(--text-secondary); margin-bottom: 10px; }
        .disk-bar { height: 8px; background: var(--bg-primary); border-radius: 4px; overflow: hidden; margin-bottom: 8px; }
        .disk-bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; }
        .disk-info { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-secondary); }

        .network-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 16px;
        }
        .network-item {
            background: var(--bg-secondary);
            border-radius: 8px;
            padding: 16px;
        }
        .network-name { font-weight: 600; font-size: 13px; margin-bottom: 6px; }
        .network-ip { font-size: 11px; color: var(--text-secondary); margin-bottom: 4px; }

        .temps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
        }
        .temp-item {
            background: var(--bg-secondary);
            border-radius: 8px;
            padding: 16px;
            text-align: center;
        }
        .temp-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
        .temp-value { font-size: 24px; font-weight: 700; }
        .temp-value.ok { color: var(--success); }
        .temp-value.warn { color: var(--warning); }
        .temp-value.hot { color: var(--danger); }

        .processes-table {
            width: 100%;
            border-collapse: collapse;
        }
        .processes-table th, .processes-table td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        .processes-table th {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            background: var(--bg-secondary);
        }
        .processes-table tr:hover { background: var(--bg-secondary); }
        .processes-table td { font-size: 13px; font-variant-numeric: tabular-nums; }
        .kill-btn {
            background: transparent;
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 2px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            opacity: 0;
            transition: all 0.2s;
        }
        .processes-table tr:hover .kill-btn { opacity: 1; }
        .kill-btn:hover { background: var(--danger); color: white; }

        /* ── Login page ── */
        .login-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .login-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        .login-box h1 {
            font-size: 28px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--accent), #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .login-box p {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }
        .login-box input {
            width: 100%;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            color: var(--text-primary);
            font-size: 14px;
            margin-bottom: 16px;
        }
        .login-box input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
        }
        .login-box button {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .login-box button:hover { opacity: 0.9; }
        .login-error {
            color: var(--danger);
            font-size: 13px;
            margin-top: 12px;
            display: none;
        }
        .login-error.show { display: block; }

        /* ── Security Panel ── */
        .security-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 16px;
        }
        .security-tab {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        .security-tab.active {
            background: var(--bg-card);
            color: var(--text-primary);
            border-bottom-color: transparent;
        }
        .security-tab:hover { color: var(--text-primary); }
        .security-tab-content { display: none; }
        .security-tab-content.active { display: block; }

        .scan-result {
            margin-top: 12px;
            padding: 12px;
            background: var(--bg-secondary);
            border-radius: 8px;
            font-size: 13px;
            font-family: monospace;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .port-list {
            display: grid;
            gap: 6px;
        }
        .port-entry {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-secondary);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-family: monospace;
        }
        .port-entry .port { color: var(--accent); font-weight: 600; }
        .port-entry .addr { color: var(--text-secondary); }

        /* ── Cleanup ── */
        .cleanup-panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 24px;
        }
        .cleanup-panel h3 {
            font-size: 16px;
            margin-bottom: 16px;
        }
        .cleanup-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 10px;
            margin-bottom: 16px;
        }
        .cleanup-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-secondary);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: border 0.2s;
        }
        .cleanup-item:hover { border-color: var(--accent); }
        .cleanup-item input { accent-color: var(--accent); }
        .cleanup-item .desc { color: var(--text-secondary); font-size: 11px; }

        .cleanup-result {
            margin-top: 12px;
            padding: 12px;
            background: var(--bg-secondary);
            border-radius: 8px;
            font-size: 13px;
            display: none;
        }
        .cleanup-result.success { display: block; border-left: 3px solid var(--success); }
        .cleanup-result.error { display: block; border-left: 3px solid var(--danger); }

        .disk-alert {
            background: var(--danger);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            display: none;
        }
        .disk-alert.active { display: block; }

        /* ── File Manager ── */
        .file-manager {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 24px;
        }
        .file-manager h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-primary);
        }
        .file-toolbar {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .file-toolbar input {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px 10px;
            color: var(--text-primary);
            font-size: 13px;
            flex: 1;
            min-width: 200px;
        }
        .file-list {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: 8px;
        }
        .file-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .file-item:last-child { border-bottom: none; }
        .file-item:hover { background: var(--bg-secondary); }
        .file-item .icon { width: 18px; text-align: center; }
        .file-item .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .file-item .size { color: var(--text-secondary); font-size: 11px; min-width: 70px; text-align: right; }
        .file-item .date { color: var(--text-secondary); font-size: 11px; min-width: 110px; text-align: right; }
        .file-item .delete-btn {
            background: transparent;
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .file-item:hover .delete-btn { opacity: 1; }
        .file-item .delete-btn:hover { background: var(--danger); color: white; }
        .file-empty {
            padding: 20px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 13px;
        }

        /* ── Terminal ── */
        .terminal-panel {
            background: #0a0a0a;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 24px;
            overflow: hidden;
        }
        .terminal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
        }
        .terminal-header h3 {
            font-size: 14px;
            font-weight: 600;
            color: var(--success);
        }
        .terminal-header span {
            font-size: 11px;
            color: var(--text-secondary);
        }
        .terminal-container {
            height: 360px;
            padding: 4px;
        }
        .terminal-container .xterm { height: 100%; }
        .footer {
            text-align: center;
            padding: 20px 0 8px;
            color: var(--text-secondary);
            font-size: 12px;
            border-top: 1px solid var(--border);
            margin-top: 24px;
        }
        .footer a { color: var(--accent); text-decoration: none; }
        .footer a:hover { text-decoration: underline; }
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-size: 18px;
            color: var(--text-secondary);
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid var(--text-secondary);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge-danger { background: rgba(239,68,68,0.2); color: var(--danger); }
        .badge-warning { background: rgba(245,158,11,0.2); color: var(--warning); }
        .badge-success { background: rgba(16,185,129,0.2); color: var(--success); }
        .badge-info { background: rgba(59,130,246,0.2); color: var(--accent); }

        @media (max-width: 768px) {
            .dashboard { padding: 8px; }
            .header { flex-direction: column; gap: 8px; margin-bottom: 16px; padding-bottom: 12px; }
            .header h1 { font-size: 18px; }
            .header-info { gap: 8px; }
            .server-name { font-size: 11px; }
            .uptime-badge { font-size: 11px; padding: 4px 8px; }
            .stats-bar { grid-template-columns: repeat(2, 1fr); gap: 6px; margin-bottom: 16px; }
            .stat-card { padding: 10px; border-radius: 8px; }
            .stat-value { font-size: 20px; }
            .stat-label { font-size: 10px; }
            .stat-detail { font-size: 10px; }
            .charts-grid { grid-template-columns: 1fr; gap: 8px; margin-bottom: 12px; }
            .charts-row { grid-template-columns: 1fr; gap: 8px; margin-bottom: 12px; }
            .chart-card { padding: 10px; border-radius: 8px; }
            .chart-card h3 { font-size: 12px; margin-bottom: 6px; }
            .chart-container { height: 120px; }
            .info-section { padding: 12px; margin-bottom: 12px; border-radius: 8px; }
            .info-section h3 { font-size: 13px; margin-bottom: 8px; }
            .disk-grid { grid-template-columns: 1fr; gap: 6px; }
            .disk-item { padding: 8px; }
            .disk-name { font-size: 11px; }
            .disk-mount, .disk-info { font-size: 10px; }
            .network-grid { grid-template-columns: 1fr; gap: 6px; }
            .network-item { padding: 8px; }
            .network-name { font-size: 11px; }
            .network-ip { font-size: 10px; }
            .temps-grid { grid-template-columns: repeat(2, 1fr); gap: 6px; }
            .temp-item { padding: 10px; }
            .temp-label { font-size: 10px; }
            .temp-value { font-size: 20px; }
            .processes-table { display: block; overflow-x: auto; white-space: nowrap; font-size: 11px; }
            .processes-table th, .processes-table td { padding: 6px 8px; font-size: 10px; }
            .processes-table th { font-size: 9px; }
            .kill-btn { font-size: 10px; padding: 1px 5px; }
            .file-manager { padding: 10px; margin-bottom: 12px; }
            .file-manager h3 { font-size: 13px; margin-bottom: 6px; }
            .file-toolbar { gap: 4px; }
            .file-toolbar input { min-width: 100px; font-size: 11px; padding: 4px 6px; flex: 2; }
            .file-toolbar button { font-size: 10px; padding: 4px 6px; }
            .file-list { max-height: 250px; }
            .file-item { font-size: 11px; padding: 4px 6px; gap: 4px; }
            .file-item .size, .file-item .date { font-size: 9px; min-width: 40px; }
            .cleanup-panel { padding: 10px; margin-bottom: 12px; }
            .cleanup-panel h3 { font-size: 13px; margin-bottom: 8px; }
            .cleanup-grid { grid-template-columns: 1fr; gap: 4px; }
            .cleanup-item { font-size: 11px; padding: 6px 8px; }
            .cleanup-item .desc { font-size: 9px; }
            .cleanup-btn { font-size: 11px; padding: 6px 10px; }
            .cleanup-run { font-size: 11px; padding: 6px 14px; }
            .security-tabs { gap: 2px; overflow-x: auto; flex-wrap: nowrap; }
            .security-tab { font-size: 11px; padding: 5px 10px; }
            .security-tab-content { font-size: 12px; }
            .terminal-panel { margin-bottom: 12px; }
            .terminal-header { padding: 6px 10px; }
            .terminal-header h3 { font-size: 12px; }
            .terminal-container { height: 200px; }
            .footer { font-size: 10px; padding: 10px 0 4px; margin-top: 12px; }
            .btn { font-size: 11px; padding: 5px 10px; }
            .btn-sm { font-size: 10px; padding: 3px 7px; }
            .badge { font-size: 9px; }
            .spinner { width: 10px; height: 10px; }
            .login-box { padding: 24px; }
            .login-box h1 { font-size: 22px; }
            .login-box input { padding: 8px 12px; font-size: 13px; }
            .login-box button { padding: 10px; font-size: 13px; }
            #settings-content { flex-direction: column; align-items: stretch; gap: 8px; }
            #pw-controls { flex-direction: column; gap: 4px; }
            #pw-controls input { width: 100%; }
            #advanced-panel .security-tab { font-size: 10px; padding: 3px 8px; }
            #sched-webhook { width: 100%; }
        }
        @media (max-width: 400px) {
            .dashboard { padding: 4px; }
            .header h1 { font-size: 15px; }
            .stats-bar { grid-template-columns: 1fr 1fr; gap: 4px; }
            .stat-card { padding: 8px; border-radius: 6px; }
            .stat-value { font-size: 16px; }
            .stat-label { font-size: 9px; }
            .stat-detail { font-size: 9px; }
            .chart-container { height: 100px; }
            .chart-card { padding: 8px; }
            .chart-card h3 { font-size: 10px; }
            .info-section { padding: 8px; }
            .info-section h3 { font-size: 11px; }
            .disk-item, .network-item, .temp-item { padding: 6px; }
            .temps-grid { grid-template-columns: 1fr 1fr; gap: 4px; }

            .file-toolbar input { min-width: 50px; font-size: 10px; }
            .file-item .size, .file-item .date { display: none; }
            .file-item { font-size: 10px; gap: 2px; }
            .security-tab { font-size: 9px; padding: 3px 6px; }
            .terminal-container { height: 150px; }
            .footer { font-size: 9px; }
            .btn { font-size: 10px; padding: 4px 8px; }
            .btn-sm { font-size: 9px; padding: 2px 5px; }
            .cleanup-item { font-size: 10px; padding: 4px 6px; }
            .cleanup-item .desc { display: none; }
            #advanced-panel .security-tab { font-size: 9px; padding: 2px 6px; }
            #settings-pw, #settings-pw-confirm { width: 100%; font-size: 11px; }
            #fw-ip { width: 100px; }
            #fw-port { width: 50px; }
            #log-search { width: 90px; }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="loading">Loading ByteSweep...</div>
    </div>
    <script>
        const CONFIG = {
            host: window.location.hostname || 'localhost',
            port: window.location.port || 5000,
            interval: 2000
        };
        const API = 'http://' + CONFIG.host + ':' + CONFIG.port + '/api';
        const HISTORY = { cpu: [], ram: [], net: [] };
        const MAX_HISTORY = 60;
        let cpuChart, ramChart, netChart;
        let prevNet = { bytes_sent: 0, bytes_recv: 0, ts: 0 };
        let AUTH_TOKEN = null;
        let AUTH_REQUIRED = false;
        let currentPath = '/';

        async function fetchJSON(url, opts) {
            opts = opts || {};
            if (AUTH_TOKEN) {
                opts.headers = opts.headers || {};
                opts.headers['X-Auth-Token'] = AUTH_TOKEN;
            }
            try {
                if (!opts.signal) {
                    opts.signal = AbortSignal.timeout(30000);
                }
                const r = await fetch(url, opts);
                if (r.status === 401) {
                    AUTH_TOKEN = null;
                    await checkAuth();
                    return null;
                }
                // Parse JSON even for error responses to get server error message
                const body = await r.json().catch(function() { return null; });
                if (!r.ok) {
                    if (body && body.error) throw new Error(body.error);
                    throw new Error('HTTP ' + r.status);
                }
                return body;
            } catch (e) {
                if (e.name === 'AbortError') return null;
                console.error(url, e.message || e);
                return null;
            }
        }

        function fmt(n, d) {
            d = d || 1;
            return n != null ? Number(n).toFixed(d) : '-';
        }

        function escHtml(str) {
            if (str == null) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#x27;');
        }

        function fmtBytes(bytes) {
            if (bytes >= 1099511627776) return (bytes / 1099511627776).toFixed(1) + ' TB';
            if (bytes >= 1073741824) return (bytes / 1073741824).toFixed(1) + ' GB';
            if (bytes >= 1048576) return (bytes / 1048576).toFixed(1) + ' MB';
            if (bytes >= 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return bytes + ' B';
        }

        // ── Auth ──

        async function checkAuth() {
            const s = await fetch(API + '/auth/status');
            if (!s) return;
            const data = await s.json();
            AUTH_REQUIRED = data.auth_enabled;
            if (AUTH_REQUIRED && !data.authenticated) {
                showLogin();
            } else if (!AUTH_REQUIRED || data.authenticated) {
                showDashboard();
            }
        }

        function showLogin() {
            document.getElementById('app').innerHTML =
                '<div class="login-wrapper">' +
                '<div class="login-box">' +
                    '<h1>ByteSweep</h1>' +
                    '<p>Server Monitor - Authentication required</p>' +
                    '<input type="password" id="login-pw" placeholder="Password" onkeydown="if(event.key===\'Enter\')doLogin()">' +
                    '<button onclick="doLogin()">Login</button>' +
                    '<div class="login-error" id="login-error">Invalid password</div>' +
                '</div></div>';
            setTimeout(function() {
                var el = document.getElementById('login-pw');
                if (el) el.focus();
            }, 100);
        }

        async function doLogin() {
            var pw = document.getElementById('login-pw').value;
            var r = await fetchJSON(API + '/auth/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({password: pw})
            });
            if (r && r.success) {
                AUTH_TOKEN = r.token;
                showDashboard();
            } else {
                var err = document.getElementById('login-error');
                if (err) err.classList.add('show');
            }
        }

        async function doLogout() {
            await fetchJSON(API + '/auth/logout', {method: 'POST'});
            AUTH_TOKEN = null;
            showLogin();
        }

        // ── Dashboard ──

        async function showDashboard() {
            document.getElementById('app').innerHTML = '<div class="loading">Loading dashboard...</div>';
            await loadAll();
        }

        function initCharts() {
            var opts = {
                responsive: true,
                maintainAspectRatio: false,
                animation: { duration: 0 },
                scales: {
                    x: { type: 'linear', display: false },
                    y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#8899a8', font: { size: 10 } } }
                },
                plugins: { legend: { display: false } }
            };

            cpuChart = new Chart(document.getElementById('cpuChart'), {
                type: 'line',
                data: { datasets: [{ borderColor: '#3b82f6', backgroundColor: 'rgba(59,130,246,0.1)', fill: true, tension: 0.4, pointRadius: 0, data: [] }] },
                options: Object.assign({}, opts, { scales: Object.assign({}, opts.scales, { y: Object.assign({}, opts.scales.y, { max: 100, title: { display: true, text: '%', color: '#8899a8' } }) }) })
            });

            ramChart = new Chart(document.getElementById('ramChart'), {
                type: 'line',
                data: { datasets: [{ borderColor: '#10b981', backgroundColor: 'rgba(16,185,129,0.1)', fill: true, tension: 0.4, pointRadius: 0, data: [] }] },
                options: Object.assign({}, opts, { scales: Object.assign({}, opts.scales, { y: Object.assign({}, opts.scales.y, { max: 100, title: { display: true, text: '%', color: '#8899a8' } }) }) })
            });

            netChart = new Chart(document.getElementById('netChart'), {
                type: 'line',
                data: { datasets: [{ borderColor: '#f59e0b', backgroundColor: 'rgba(245,158,11,0.1)', fill: true, tension: 0.4, pointRadius: 0, data: [] }] },
                options: Object.assign({}, opts, { scales: Object.assign({}, opts.scales, { y: Object.assign({}, opts.scales.y, { min: 0, title: { display: true, text: 'KB/s', color: '#8899a8' } }) }) })
            });
        }

        function updateCharts() {
            cpuChart.data.datasets[0].data = HISTORY.cpu;
            cpuChart.update('none');
            ramChart.data.datasets[0].data = HISTORY.ram;
            ramChart.update('none');
            netChart.data.datasets[0].data = HISTORY.net;
            netChart.update('none');
        }

        function updateHistory(m, init) {
            const now = Date.now();
            HISTORY.cpu.push({ x: now, y: m.cpu });
            HISTORY.ram.push({ x: now, y: m.ram ? m.ram.percent : 0 });

            var netTotal;
            if (init || !prevNet.ts) {
                netTotal = 0;
            } else {
                var elapsed = (now - prevNet.ts) / 1000;
                if (elapsed > 0) {
                    var rxDelta = m.network.bytes_recv - prevNet.bytes_recv;
                    var txDelta = m.network.bytes_sent - prevNet.bytes_sent;
                    netTotal = (rxDelta + txDelta) / elapsed;
                } else {
                    netTotal = 0;
                }
            }
            prevNet = { bytes_sent: m.network.bytes_sent, bytes_recv: m.network.bytes_recv, ts: now };
            HISTORY.net.push({ x: now, y: netTotal / 1024 });

            [HISTORY.cpu, HISTORY.ram, HISTORY.net].forEach(function(h) {
                while (h.length > MAX_HISTORY) h.shift();
            });
        }

        async function loadAll() {
            const [sys, metrics] = await Promise.all([
                fetchJSON(API + '/system'),
                fetchJSON(API + '/metrics')
            ]);
            if (!sys || !metrics) {
                document.getElementById('app').innerHTML = '<div class="loading">Connection failed. Retrying in 3s...</div>';
                setTimeout(loadAll, 3000);
                return;
            }
            prevNet = { bytes_sent: metrics.network.bytes_sent, bytes_recv: metrics.network.bytes_recv, ts: Date.now() };
            updateHistory(metrics, true);
            renderDashboard(sys, metrics);
            initCharts();
            loadFiles('/');
            loadCleanupItems();
            loadSecurityPorts();
            loadSettings();
            initTerminal();
        }

        function renderDashboard(sys, m) {
            function diskColor(p) { return p > 90 ? 'var(--danger)' : p > 75 ? 'var(--warning)' : 'var(--accent)'; }
            function tempClass(t) { return t < 60 ? 'ok' : t < 80 ? 'warn' : 'hot'; }

            var uptimeStr = sys.uptime.days + 'd ' + sys.uptime.hours + 'h ' + sys.uptime.minutes + 'm';
            var cpuCores = m.cpu_cores ? m.cpu_cores.length : sys.cpu_count;
            var loadStr = m.load ? fmt(m.load['1min'], 1) + ' / ' + fmt(m.load['5min'], 1) + ' / ' + fmt(m.load['15min'], 1) : '-';
            var totalDiskUsed = 0, totalDiskSize = 0;
            (m.disk || []).forEach(function(d) { totalDiskUsed += d.used; totalDiskSize += d.total; });
            var totalDiskPct = totalDiskSize > 0 ? (totalDiskUsed / totalDiskSize * 100) : 0;
            var netLastPoint = HISTORY.net.length > 0 ? HISTORY.net[HISTORY.net.length - 1].y : 0;
            var logoutBtn = AUTH_REQUIRED ? '<button class="btn btn-danger btn-sm" onclick="doLogout()">Logout</button>' : '';

            var html = '<div class="dashboard">' +
                '<div class="header">' +
                    '<div style="display:flex;align-items:center;gap:12px"><h1>ByteSweep</h1>' +
                    '<span class="disk-alert" id="disk-alert">&#9888; Disk above 90% &mdash; run cleanup</span></div>' +
                    '<div class="header-info">' +
                        '<span class="uptime-badge"><span class="status-dot"></span>' + uptimeStr + '</span>' +
                        '<span class="server-name">' + escHtml(sys.hostname || 'unknown') + ' &middot; ' + escHtml(sys.platform) + '</span>' +
                        logoutBtn +
                    '</div>' +
                '</div>' +

                '<div class="stats-bar">' +
                    '<div class="stat-card" id="stat-cpu">' +
                        '<div class="stat-label">CPU Usage</div>' +
                        '<div class="stat-value">' + fmt(m.cpu) + '%</div>' +
                        '<div class="stat-detail">' + cpuCores + ' cores &middot; load ' + loadStr + '</div>' +
                    '</div>' +
                    '<div class="stat-card" id="stat-ram">' +
                        '<div class="stat-label">Memory</div>' +
                        '<div class="stat-value">' + fmt(m.ram.percent) + '%</div>' +
                        '<div class="stat-detail">' + fmtBytes(m.ram.used) + ' / ' + fmtBytes(m.ram.total) + '</div>' +
                    '</div>' +
                    '<div class="stat-card" id="stat-disk">' +
                        '<div class="stat-label">Disk Total</div>' +
                        '<div class="stat-value">' + fmt(totalDiskPct) + '%</div>' +
                        '<div class="stat-detail">' + fmtBytes(totalDiskUsed) + ' / ' + fmtBytes(totalDiskSize) + '</div>' +
                    '</div>' +
                    '<div class="stat-card" id="stat-net">' +
                        '<div class="stat-label">Network Rate</div>' +
                        '<div class="stat-value">' + fmt(netLastPoint, 1) + '</div>' +
                        '<div class="stat-detail">KB/s &middot; ' + Object.keys(m.network_ifaces || {}).length + ' ifaces</div>' +
                    '</div>' +
                '</div>' +

                '<div class="charts-grid">' +
                    '<div class="chart-card"><h3>CPU Usage (%)</h3><div class="chart-container"><canvas id="cpuChart"></canvas></div></div>' +
                    '<div class="chart-card"><h3>Memory Usage (%)</h3><div class="chart-container"><canvas id="ramChart"></canvas></div></div>' +
                '</div>' +

                '<div class="charts-grid">' +
                    '<div class="chart-card"><h3>Network Traffic (KB/s)</h3><div class="chart-container"><canvas id="netChart"></canvas></div></div>' +
                    '<div class="chart-card" id="load-card">' +
                        '<h3>System Load</h3>' +
                        '<div class="chart-container" style="display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px">' +
                            '<div style="font-size:28px;font-weight:700;color:var(--text-primary)" id="load-1m">' + fmt(m.load['1min'], 2) + '</div>' +
                            '<div style="font-size:12px;color:var(--text-secondary)">5min: ' + fmt(m.load['5min'], 2) + ' &middot; 15min: ' + fmt(m.load['15min'], 2) + '</div>' +
                        '</div>' +
                    '</div>' +
                '</div>';

            // Disks
            html += '<div class="info-section"><h3>Disk Space</h3><div class="disk-grid">';
            if (m.disk && m.disk.length > 0) {
                m.disk.forEach(function(d) {
                    html += '<div class="disk-item">' +
                        '<div class="disk-name">' + d.device + '</div>' +
                        '<div class="disk-mount">' + d.mountpoint + ' (' + d.fstype + ')</div>' +
                        '<div class="disk-bar"><div class="disk-bar-fill" style="width:' + d.percent + '%;background:' + diskColor(d.percent) + '"></div></div>' +
                        '<div class="disk-info"><span>' + fmtBytes(d.used) + ' / ' + fmtBytes(d.total) + '</span><span>' + fmt(d.percent) + '%</span></div>' +
                    '</div>';
                });
            } else {
                html += '<div style="color:var(--text-secondary);font-size:13px">No disk data available</div>';
            }
            html += '</div></div>';

            // Network interfaces
            html += '<div class="info-section"><h3>Network Interfaces</h3><div class="network-grid">';
            var ifaces = m.network_ifaces || {};
            var ifaceNames = Object.keys(ifaces);
            if (ifaceNames.length > 0) {
                ifaceNames.forEach(function(name) {
                    var iface = ifaces[name];
                    html += '<div class="network-item">' +
                        '<span class="network-name">' + name + '</span>' +
                        '<span class="network-ip">' + (iface.ip || '-') + (iface.mac ? ' &middot; ' + iface.mac : '') + '</span>' +
                    '</div>';
                });
            } else {
                html += '<div style="color:var(--text-secondary);font-size:13px">No network interfaces</div>';
            }
            html += '</div></div>';

            // Temperatures
            if (m.temps && m.temps.length > 0) {
                html += '<div class="info-section"><h3>Temperatures</h3><div class="temps-grid">';
                m.temps.forEach(function(t) {
                    html += '<div class="temp-item">' +
                        '<div class="temp-label">' + (t.label || 'sensor') + '</div>' +
                        '<div class="temp-value ' + tempClass(t.current) + '">' + fmt(t.current, 0) + '&deg;C</div>' +
                        '<div style="font-size:10px;color:var(--text-secondary);margin-top:4px">max ' + fmt(t.high, 0) + '&deg;C</div>' +
                    '</div>';
                });
                html += '</div></div>';
            }

            // Top processes (with kill buttons)
            html += '<div class="info-section"><h3>Top Processes</h3>' +
                '<table class="processes-table">' +
                    '<thead><tr><th>PID</th><th>Name</th><th>CPU%</th><th>Memory%</th><th style="width:60px"></th></tr></thead><tbody id="proc-body">';
            if (m.top_processes && m.top_processes.length > 0) {
                m.top_processes.slice(0, 12).forEach(function(p) {
                    html += '<tr><td>' + p.pid + '</td><td>' + escHtml(p.name) + '</td><td>' + fmt(p.cpu, 1) + '%</td><td>' + fmt(p.mem, 1) + '%</td>' +
                        '<td><button class="kill-btn" onclick="killProcess(' + p.pid + ',this)" title="Kill process">&#10005;</button></td></tr>';
                });
            } else {
                html += '<tr><td colspan="5" style="color:var(--text-secondary)">No process data</td></tr>';
            }
            html += '</tbody></table></div>';

            // ── Security Panel ──
            html += '<div class="info-section" id="security-panel">' +
                '<h3>&#128737; Security</h3>' +
                '<div class="security-tabs">' +
                    '<div class="security-tab active" onclick="switchSecurityTab(\'ports\')">Open Ports</div>' +
                    '<div class="security-tab" onclick="switchSecurityTab(\'mining\')">Mining</div>' +
                    '<div class="security-tab" onclick="switchSecurityTab(\'forensic\')">Forensic Scan</div>' +
                    '<div class="security-tab" onclick="switchSecurityTab(\'virus\')">Virus Scan</div>' +
                '</div>' +
                '<div class="security-tab-content active" id="tab-ports">' +
                    '<div id="ports-content"><span class="spinner"></span>Loading ports...</div>' +
                '</div>' +
                '<div class="security-tab-content" id="tab-mining">' +
                    '<div style="margin-bottom:12px">' +
                        '<button class="btn btn-warning" onclick="runMiningDetect()" id="mining-btn">&#9888; Scan for Miners</button>' +
                    '</div>' +
                    '<div id="mining-result"></div>' +
                '</div>' +
                '<div class="security-tab-content" id="tab-forensic">' +
                    '<div style="margin-bottom:12px">' +
                        '<button class="btn btn-danger" onclick="runForensicScan()" id="forensic-btn">&#128269; Run Full Forensic Scan</button>' +
                        '<span style="font-size:11px;color:var(--text-secondary);margin-left:8px">Checks hidden dirs, backdoors, rootkits, C2, persistence</span>' +
                    '</div>' +
                    '<div id="forensic-result"></div>' +
                '</div>' +
                '<div class="security-tab-content" id="tab-virus">' +
                    '<div style="margin-bottom:12px">' +
                        '<button class="btn btn-danger" onclick="runVirusScan()" id="virus-btn">&#128737; Run Virus Scan</button>' +
                        '<span style="font-size:11px;color:var(--text-secondary);margin-left:8px">Requires ClamAV</span>' +
                    '</div>' +
                    '<div id="virus-result"></div>' +
                '</div>' +
            '</div>';

            // File Manager
            html += '<div class="info-section" id="settings-panel">' +
                '<h3>&#9881; Settings</h3>' +
                '<div id="settings-content" style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">' +
                    '<div style="display:flex;align-items:center;gap:8px">' +
                        '<span style="font-size:13px">Password protection:</span>' +
                        '<span class="badge badge-success" id="pw-badge-off" style="display:none">OFF</span>' +
                        '<span class="badge badge-danger" id="pw-badge-on" style="display:none">ON</span>' +
                    '</div>' +
                    '<div id="pw-controls" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">' +
                        '<input type="password" id="settings-pw" placeholder="New password" style="background:var(--bg-secondary);border:1px solid var(--border);border-radius:6px;padding:6px 10px;color:var(--text-primary);font-size:13px;width:160px">' +
                        '<input type="password" id="settings-pw-confirm" placeholder="Confirm password" style="background:var(--bg-secondary);border:1px solid var(--border);border-radius:6px;padding:6px 10px;color:var(--text-primary);font-size:13px;width:160px">' +
                        '<button class="btn btn-sm btn-accent" onclick="enablePassword()">Enable</button>' +
                        '<button class="btn btn-sm btn-danger" id="disable-pw-btn" onclick="disablePassword()" style="display:none">Disable</button>' +
                    '</div>' +
                    '<span id="settings-msg" style="font-size:12px;color:var(--text-secondary)"></span>' +
                '</div>' +
            '</div>';

            // Advanced Panel
            html += '<div class="info-section" id="advanced-panel">' +
                '<h3>&#128640; Advanced</h3>' +
                '<div class="security-tabs" style="margin-bottom:16px">' +
                    '<div class="security-tab active" onclick="switchAdvTab(\'scheduler\')">Scheduler</div>' +
                    '<div class="security-tab" onclick="switchAdvTab(\'firewall\')">Firewall</div>' +
                    '<div class="security-tab" onclick="switchAdvTab(\'integrity\')">Integrity</div>' +
                    '<div class="security-tab" onclick="switchAdvTab(\'logs\')">Logs</div>' +
                '</div>' +
                '<div class="security-tab-content active" id="adv-scheduler">' +
                    '<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:12px">' +
                        '<div style="display:flex;align-items:center;gap:8px"><span style="font-size:13px">Scan every:</span>' +
                        '<input type="number" id="sched-interval" value="3600" min="300" step="300" style="background:var(--bg-secondary);border:1px solid var(--border);border-radius:6px;padding:4px 8px;color:var(--text-primary);font-size:12px;width:80px">' +
                        '<span style="font-size:11px;color:var(--text-secondary)">sec</span></div>' +
                        '<input type="text" id="sched-webhook" placeholder="Telegram/Discord webhook URL" style="background:var(--bg-secondary);border:1px solid var(--border);border-radius:6px;padding:4px 8px;color:var(--text-primary);font-size:12px;width:280px">' +
                        '<button class="btn btn-sm btn-accent" id="sched-start-btn" onclick="startScheduler()">Start</button>' +
                        '<button class="btn btn-sm btn-danger" id="sched-stop-btn" onclick="stopScheduler()" style="display:none">Stop</button>' +
                    '</div>' +
                    '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">' +
                        '<span style="font-size:12px">Auto-kill miners:</span>' +
                        '<button class="btn btn-sm" id="autokill-btn" onclick="toggleAutoKill()">OFF</button>' +
                        '<span id="sched-status" style="font-size:11px;color:var(--text-secondary)"></span>' +
                    '</div>' +
                    '<div id="sched-msg" style="font-size:12px;color:var(--text-secondary)"></div>' +
                '</div>' +
                '<div class="security-tab-content" id="adv-firewall">' +
                    '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px">' +
                        '<input type="text" id="fw-ip" placeholder="IP to block" style="background:var(--bg-secondary);border:1px solid var(--border);border-radius:6px;padding:4px 8px;color:var(--text-primary);font-size:12px;width:140px">' +
                        '<input type="number" id="fw-port" placeholder="Port" style="background:var(--bg-secondary);border:1px solid var(--border);border-radius:6px;padding:4px 8px;color:var(--text-primary);font-size:12px;width:65px">' +
                        '<button class="btn btn-sm btn-danger" onclick="blockIP()">Block</button>' +
                        '<button class="btn btn-sm" onclick="loadFirewall()">&#8635;</button>' +
                    '</div>' +
                    '<div id="firewall-rules" style="font-size:11px;font-family:monospace;max-height:300px;overflow-y:auto"></div>' +
                '</div>' +
                '<div class="security-tab-content" id="adv-integrity">' +
                    '<div style="display:flex;gap:8px;margin-bottom:12px">' +
                        '<button class="btn btn-sm btn-accent" onclick="createBaseline()">Create Baseline</button>' +
                        '<button class="btn btn-sm btn-warning" onclick="checkIntegrity()">Check Integrity</button>' +
                    '</div>' +
                    '<div id="integrity-result" style="font-size:12px;font-family:monospace;max-height:300px;overflow-y:auto"></div>' +
                '</div>' +

        // ── Security: Ports ──

        async function loadSecurityPorts() {
            var el = document.getElementById('ports-content');
            if (!el) return;
            var data = await fetchJSON(API + '/security/ports');
            if (!data) {
                el.innerHTML = '<span style="color:var(--danger);font-size:13px">Failed to load port data</span>';
                return;
            }
            var html = '<div class="result-header">' +
                '<span><span class="badge badge-info">' + data.total_listening + ' listening</span> ' +
                '<span class="badge badge-success">' + data.total_established + ' established</span> ' +
                '<span class="badge badge-warning">' + data.total_recent + ' recent</span></span>' +
                '<button class="btn btn-sm" onclick="loadSecurityPorts()">&#8635; Refresh</button>' +
            '</div>';

            if (data.listening && data.listening.length > 0) {
                html += '<div style="margin-top:8px;font-size:12px;color:var(--text-secondary);margin-bottom:4px">Listening Ports:</div>';
                html += '<div class="port-list">';
                data.listening.forEach(function(p) {
                    var addr = p.address || '0.0.0.0';
                    var port = p.port || '?';
                    var proc = p.process || '';
                    html += '<div class="port-entry"><span><span class="port">:' + escHtml(port) + '</span> (' + (p.protocol || 'tcp') + ')</span><span class="addr">' + escHtml(proc || addr) + '</span></div>';
                });
                html += '</div>';
            }
            if (data.established && data.established.length > 0) {
                html += '<div style="margin-top:12px;font-size:12px;color:var(--text-secondary);margin-bottom:4px">Established Connections:</div>';
                html += '<div class="port-list">';
                data.established.slice(0, 15).forEach(function(p) {
                    var local = (p.local_address || p.address || '?') + ':' + (p.local_port || p.port || '?');
                    var remote = p.remote_address ? (p.remote_address + ':' + p.remote_port) : '';
                    html += '<div class="port-entry"><span>' + escHtml(local) + (remote ? ' &rarr; ' + escHtml(remote) : '') + '</span></div>';
                });
                html += '</div>';
            }
            if (data.recent && data.recent.length > 0) {
                html += '<div style="margin-top:12px;font-size:12px;color:var(--text-secondary);margin-bottom:4px">Recent Connections:</div>';
                html += '<div class="port-list">';
                data.recent.forEach(function(p) {
                    var local = escHtml((p.local_address || p.address || '?')) + ':<span class="port">' + escHtml(p.local_port || p.port || '?') + '</span>';
                    var remote = p.remote_address ? (' &rarr; <span style="color:var(--warning)">' + escHtml(p.remote_address) + ':' + escHtml(p.remote_port || '') + '</span>') : '';
                    html += '<div class="port-entry"><span>' + local + remote + '</span></div>';
                });
                html += '</div>';
            }
            el.innerHTML = html;
        }

        // ── Security: Forensic Scan ──

        async function runForensicScan() {
            var btn = document.getElementById('forensic-btn');
            var result = document.getElementById('forensic-result');
            btn.disabled = true;
            btn.textContent = 'Scanning (may take a while)...';
            result.innerHTML = '<span class="spinner"></span> Running full forensic scan...';

            var data = await fetchJSON(API + '/security/forensic-scan');
            btn.disabled = false;
            btn.textContent = 'Run Full Forensic Scan';

            if (!data) {
                result.innerHTML = '<div style="color:var(--danger);font-size:13px;margin-top:8px">Scan failed</div>';
                return;
            }

            var total = data.total_findings || 0;
            var html = '';

            if (total === 0) {
                html += '<div style="color:var(--success);font-size:14px;margin-top:8px">&#10003; No threats found &mdash; system appears clean</div>';
            } else {
                html += '<div style="color:var(--danger);font-size:14px;margin-top:8px;margin-bottom:12px"><b>&#9888; ' + total + ' potential threat(s) detected!</b></div>';
            }

            // Build compact report
            var sections = [
                {key: 'hidden_dirs', label: 'Hidden Directories', icon: '&#128193;'},
                {key: 'suspicious_binaries', label: 'Suspicious Binaries', icon: '&#9888;'},
                {key: 'backdoor_ssh', label: 'SSH Backdoors', icon: '&#128737;'},
                {key: 'rootkit_signs', label: 'Rootkit Signs', icon: '&#9762;'},
                {key: 'ld_preload', label: 'LD_PRELOAD', icon: '&#128065;'},
                {key: 'suspicious_cron', label: 'Suspicious Cron', icon: '&#9200;'},
                {key: 'suspicious_systemd', label: 'Suspicious Systemd', icon: '&#9881;'},
                {key: 'c2_agents', label: 'C2 Agents', icon: '&#128225;'},
                {key: 'reverse_shells', label: 'Reverse Shells', icon: '&#128279;'},
                {key: 'mining_connections', label: 'Mining Connections', icon: '&#9935;'}
            ];

            sections.forEach(function(s) {
                var val = data[s.key];
                if (!val) return;
                var count = val.findings_count !== undefined ? val.findings_count : (val.length || 0);
                var findings = val.findings || val;

                var severityColor = count > 0 ? 'var(--danger)' : 'var(--text-secondary)';
                html += '<div style="margin-top:12px;padding:10px;background:var(--bg-secondary);border-radius:8px">';
                html += '<div style="display:flex;justify-content:space-between;align-items:center">';
                html += '<span style="font-size:13px;font-weight:600">' + s.icon + ' ' + s.label + '</span>';
                html += '<span style="font-size:12px;color:' + severityColor + ';font-weight:600">' + count + ' found</span>';
                html += '</div>';

                if (count > 0) {
                    findings.slice(0, 8).forEach(function(f) {
                        var sevBadge = f.severity === 'critical' ? '<span class="badge badge-danger">CRIT</span>' :
                                       f.severity === 'high' ? '<span class="badge badge-warning">HIGH</span>' :
                                       '<span class="badge badge-info">MED</span>';
                        var desc = '';
                        if (s.key === 'hidden_dirs') desc = f.path + ' (' + f.size_str + ')';
                        else if (s.key === 'suspicious_binaries') desc = f.path + ' (' + f.size_str + ')' + (f.is_upx_packed ? ' [UPX]' : '');
                        else if (s.key === 'backdoor_ssh') desc = f.detail || f.content || JSON.stringify(f);
                        else if (s.key === 'suspicious_cron') desc = f.content ? f.content.substring(0,100) : '';
                        else if (s.key === 'suspicious_systemd') desc = f.name;
                        else if (s.key === 'c2_agents') desc = f.name + ' (PID ' + f.pid + ')';
                        else if (s.key === 'reverse_shells') desc = f.name + ' (PID ' + f.pid + ') - ' + (f.pattern_matched || '');
                        else if (s.key === 'mining_connections') desc = f.detail || (f.remote || '');
                        else desc = f.detail || f.path || f.content || f.module || JSON.stringify(f).substring(0, 100);
                        html += '<div style="font-size:11px;color:var(--text-secondary);margin-top:4px;padding-left:8px">' +
                            sevBadge + ' ' + desc + '</div>';
                    });
                    if (count > 8) {
                        html += '<div style="font-size:11px;color:var(--text-secondary);margin-top:4px">+ ' + (count - 8) + ' more...</div>';
                    }
                }
                html += '</div>';
            });

            result.innerHTML = html;
        }

        // ── Security: Virus Scan ──

        async function runVirusScan() {
            var btn = document.getElementById('virus-btn');
            var result = document.getElementById('virus-result');

            // Check if ClamAV is installed
            var status = await fetchJSON(API + '/security/clamav-status');
            if (status && !status.installed) {
                if (confirm('ClamAV is not installed. Install it now?\n\n~200 MB download. This will run:\napt install clamav clamav-daemon')) {
                    await installClamAV();
                    return;
                }
                result.innerHTML = '<div style="color:var(--text-secondary);font-size:13px;margin-top:8px">ClamAV not installed. Install manually: apt install clamav</div>';
                return;
            }

            // Run actual scan with longer timeout
            btn.disabled = true;
            btn.textContent = 'Scanning (may take a while)...';
            result.innerHTML = '<span class="spinner"></span> Running ClamAV scan (this can take several minutes)...';

            data = await fetchJSON(API + '/security/virus-scan', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                signal: AbortSignal.timeout(600000),
                body: JSON.stringify({paths: null})
            });
            btn.disabled = false;
            btn.textContent = 'Run Virus Scan';

            if (!data || !data.success) {
                result.innerHTML = '<div style="color:var(--danger);font-size:13px;margin-top:8px">' + (data && data.error ? data.error : 'Scan failed') + '</div>';
                return;
            }

            var html = '<div style="font-size:13px;margin-top:8px">';
            if (data.total_infected === 0) {
                html += '<div style="color:var(--success);margin-bottom:8px">&#10003; No viruses found</div>';
            } else {
                html += '<div style="color:var(--danger);margin-bottom:8px"><b>&#9888; ' + data.total_infected + ' infected file(s) found!</b></div>';
            }
            html += '<div style="font-size:11px;color:var(--text-secondary)">Scanner: ' + (data.clamav || 'unknown') + '</div>';
            data.results.forEach(function(r) {
                if (r.infected > 0) {
                    html += '<div style="color:var(--danger);margin-top:4px"><b>' + r.path + ':</b> ' + r.infected + ' infected</div>';
                    r.infected_files.forEach(function(f) {
                        html += '<div style="font-size:11px;color:var(--danger);margin-left:12px">- ' + f + '</div>';
                    });
                } else if (!r.error) {
                    html += '<div style="color:var(--text-secondary);margin-top:4px">' + r.path + ': clean' + (r.files_scanned ? ' (' + r.files_scanned + ' files scanned)' : '') + '</div>';
                } else {
                    html += '<div style="color:var(--warning);margin-top:4px">' + r.path + ': ' + r.error + '</div>';
                }
            });
            html += '</div>';
            result.innerHTML = html;
        }

        async function installClamAV() {
            var btn = document.getElementById('virus-btn');
            var result = document.getElementById('virus-result');
            btn.disabled = true;
            btn.textContent = 'Installing ClamAV...';
            result.innerHTML = '<span class="spinner"></span> Installing ClamAV (this may take a few minutes)...';

            // Use longer timeout for apt operations
            var data = await fetchJSON(API + '/security/install-clamav', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                signal: AbortSignal.timeout(600000),
                body: JSON.stringify({})
            });

            btn.disabled = false;
            btn.textContent = 'Run Virus Scan';

            if (data && data.success) {
                result.innerHTML = '<div style="color:var(--success);font-size:13px;margin-top:8px">&#10003; ' + (data.message || 'ClamAV installed!') + '</div>' +
                    '<button class="btn btn-sm" style="margin-top:8px" onclick="runVirusScan()">Run Virus Scan Now</button>';
            } else {
                result.innerHTML = '<div style="color:var(--danger);font-size:13px;margin-top:8px">Installation failed: ' + (data && data.error ? data.error : 'Timeout or connection error') + '</div>';
            }

        // ── Process Kill ──

        async function killProcess(pid, btn) {
            if (!confirm('Kill process PID ' + pid + '?')) return;
            if (btn) {
                btn.disabled = true;
                btn.textContent = '...';
            }
            // Use longer timeout since kill can take a few seconds
            var data = await fetchJSON(API + '/process/kill', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                signal: AbortSignal.timeout(15000),
                body: JSON.stringify({pid: pid})
            });
            if (data && data.success) {
                if (btn) {
                    var row = btn.closest('tr');
                    if (row) row.style.opacity = '0.4';
                    btn.disabled = true;
                    btn.textContent = '\u2713';
                }
            } else {
                var errMsg = data && data.error ? data.error : 'Could not connect to server';
                alert('Failed to kill process: ' + errMsg);
                if (btn) {
                    btn.disabled = false;
                    btn.textContent = '\u2715';
                }
            }
        }

        // ── Scheduler + Auto-Kill ──

        async function loadSchedulerStatus() {
            var s = await fetchJSON(API + '/security/scheduler');
            var ak = await fetchJSON(API + '/security/auto-kill');
            var badge = document.getElementById('sched-badge');
            var startBtn = document.getElementById('sched-start-btn');
            var stopBtn = document.getElementById('sched-stop-btn');
            var autokillBtn = document.getElementById('autokill-btn');
            var statusEl = document.getElementById('sched-status');

            if (s && s.running) {
                if (badge) { badge.textContent = 'RUNNING'; badge.className = 'badge badge-success'; }
                if (startBtn) startBtn.style.display = 'none';
                if (stopBtn) stopBtn.style.display = 'inline-block';
                if (statusEl) statusEl.textContent = 'Every ' + s.interval + 's, last: ' + (s.last_run || '-');
            } else {
                if (badge) { badge.textContent = 'STOPPED'; badge.className = 'badge badge-info'; }
                if (startBtn) startBtn.style.display = 'inline-block';
                if (stopBtn) stopBtn.style.display = 'none';
                if (statusEl) statusEl.textContent = '';
            }
            if (ak && autokillBtn) {
                autokillBtn.textContent = ak.enabled ? 'ON' : 'OFF';
                autokillBtn.className = ak.enabled ? 'btn btn-sm btn-danger' : 'btn btn-sm';
            }
        }

        async function startScheduler() {
            var interval = parseInt(document.getElementById('sched-interval').value) || 3600;
            var webhook = document.getElementById('sched-webhook').value.trim();
            var r = await fetchJSON(API + '/security/scheduler/start', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({interval: interval, webhook_url: webhook || null})
            });
            document.getElementById('sched-msg').innerHTML = '<span style="color:' + (r && r.success ? 'var(--success)' : 'var(--danger)') + '">' + (r ? r.message : 'Error') + '</span>';
            loadSchedulerStatus();

            var r = await fetchJSON(API + '/security/scheduler/stop', {method: 'POST'});
            document.getElementById('sched-msg').innerHTML = '<span style="color:var(--success)">' + (r ? r.message : 'Stopped') + '</span>';
            loadSchedulerStatus();

            var btn = document.getElementById('autokill-btn');
            var current = btn.textContent === 'ON';
            var r = await fetchJSON(API + '/security/auto-kill', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},

        async function loadFirewall() {

            var port = document.getElementById('fw-port').value.trim();

                method: 'POST',
                headers: {'Content-Type': 'application/json'},

        async function createBaseline() {

            el.innerHTML = '<span class="spinner"></span> Creating baseline...';
            var r = await fetchJSON(API + '/security/integrity/baseline', {method: 'POST'});

                el.innerHTML = '<span style="color:var(--success)">Baseline created: ' + r.files_hashed + ' files hashed at ' + r.timestamp + '</span>';
