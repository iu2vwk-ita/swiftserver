        async function checkIntegrity() {
            var el = document.getElementById('integrity-result');
            el.innerHTML = '<span class="spinner"></span> Checking...';
            var r = await fetchJSON(API + '/security/integrity/check');
            if (!r) { el.innerHTML = '<span style="color:var(--danger)">Failed</span>'; return; }
            var html = '';
            if (!r.has_baseline) {
                html += '<div style="color:var(--warning)">No baseline &mdash; create one first</div>';
            } else if (r.changed.length === 0 && r.missing.length === 0) {
                html += '<div style="color:var(--success)">All ' + r.total + ' files OK</div>';
            } else {
                if (r.changed.length > 0) {
                    html += '<div style="color:var(--danger)"><b>' + r.changed.length + ' file(s) modified:</b></div>';
                    r.changed.forEach(function(f) {
                        html += '<div style="margin-left:8px;color:var(--danger)">' + f.path + ' (' + f.old_hash + ' &rarr; ' + f.new_hash + ')</div>';
                    });
                }
                if (r.missing.length > 0) {
                    html += '<div style="color:var(--warning);margin-top:4px"><b>' + r.missing.length + ' file(s) missing:</b></div>';
                    r.missing.forEach(function(f) {
                        html += '<div style="margin-left:8px;color:var(--warning)">' + f.path + ' (' + f.status + ')</div>';
                    });
                }
                html += '<div style="color:var(--success);margin-top:4px">' + r.ok + ' files unchanged</div>';
            }
            el.innerHTML = html;
        }

        // ── Log Viewer ──

        async function loadLog() {
            var el = document.getElementById('log-content');
            var logName = document.getElementById('log-select').value;
            var search = document.getElementById('log-search').value.trim();
            el.innerHTML = 'Loading...';
            var params = '?lines=200';
            if (search) params += '&search=' + encodeURIComponent(search);
            var data = await fetchJSON(API + '/security/logs/' + logName + params);
            if (!data || !data.success) {
                el.innerHTML = '<span style="color:var(--danger)">' + (data ? data.error : 'Error') + '</span>';
                return;
            }
            if (data.lines.length === 0) {
                el.innerHTML = '<span style="color:var(--text-secondary)">No lines' + (search ? ' matching "' + escHtml(search) + '"' : '') + '</span>';
                return;
            }
            var html = '<div style="color:var(--text-secondary);margin-bottom:4px">' + data.returned_lines + ' of ' + data.filtered_lines + ' lines</div>';
            data.lines.forEach(function(line) {
                if (search) {
                    var regex = new RegExp('(' + search.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
                    line = escHtml(line).replace(regex, '<mark style="background:var(--warning);color:#000">$1</mark>');
                } else {
                    line = escHtml(line);
                }
                html += '<div style="border-bottom:1px solid var(--border);padding:1px 0">' + line + '</div>';
            });
            el.innerHTML = html;
        }

        // ── Settings ──

        async function loadSettings() {
            var s = await fetchJSON(API + '/settings');
            if (!s) return;
            var badgeOff = document.getElementById('pw-badge-off');
            var badgeOn = document.getElementById('pw-badge-on');
            var disableBtn = document.getElementById('disable-pw-btn');
            if (s.password_enabled) {
                if (badgeOff) badgeOff.style.display = 'none';
                if (badgeOn) badgeOn.style.display = 'inline-block';
                if (disableBtn) disableBtn.style.display = 'inline-block';
            } else {
                if (badgeOff) badgeOff.style.display = 'inline-block';
                if (badgeOn) badgeOn.style.display = 'none';
                if (disableBtn) disableBtn.style.display = 'none';
            }
        }

        async function enablePassword() {
            var pw = document.getElementById('settings-pw').value;
            var confirm = document.getElementById('settings-pw-confirm').value;
            var msg = document.getElementById('settings-msg');
            if (!pw || pw.length < 4) {
                msg.innerHTML = '<span style="color:var(--danger)">Min 4 characters</span>';
                return;
            }
            if (pw !== confirm) {
                msg.innerHTML = '<span style="color:var(--danger)">Passwords dont match</span>';
                return;
            }
            var r = await fetchJSON(API + '/settings', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({action: 'set_password', password: pw})
            });
            if (r && r.success) {
                msg.innerHTML = '<span style="color:var(--success)">Password enabled! All sessions reset.</span>';
                document.getElementById('settings-pw').value = '';
                document.getElementById('settings-pw-confirm').value = '';
                loadSettings();
            } else {
                msg.innerHTML = '<span style="color:var(--danger)">' + ((r && r.error) || 'Failed') + '</span>';
            }
        }

        async function disablePassword() {
            if (!confirm('Disable password protection? Everyone will have access.')) return;
            var msg = document.getElementById('settings-msg');
            var r = await fetchJSON(API + '/settings', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({action: 'disable_password'})
            });
            if (r && r.success) {
                msg.innerHTML = '<span style="color:var(--success)">Password disabled.</span>';
                loadSettings();
            } else {
                msg.innerHTML = '<span style="color:var(--danger)">' + ((r && r.error) || 'Failed') + '</span>';
            }
        }

        // ── Cleanup ──

        async function loadCleanupItems() {
            var grid = document.getElementById('cleanup-items');
            if (!grid) return;
            grid.innerHTML = '<div style="color:var(--text-secondary);font-size:12px">Loading...</div>';
            var data = await fetchJSON(API + '/cleanup/status');
            if (!data || !data.items) {
                grid.innerHTML = '<div style="color:var(--danger);font-size:12px">Failed to load</div>';
                return;
            }
            grid.innerHTML = '';
            data.items.forEach(function(item) {
                var div = document.createElement('div');
                div.className = 'cleanup-item';
                div.innerHTML = '<input type="checkbox" id="cln-' + item.id + '" checked>' +
                    '<div><div>' + item.name + '</div><div class="desc">' + item.description + '</div></div>';
                div.onclick = function(e) { if (e.target.tagName !== 'INPUT') { var cb = this.querySelector('input'); cb.checked = !cb.checked; } };
                grid.appendChild(div);
            });
        }

        async function runCleanup() {
            var btn = document.getElementById('cleanup-run-btn');
            var result = document.getElementById('cleanup-result');
            btn.disabled = true;
            btn.textContent = 'Running...';
            result.className = 'cleanup-result';
            result.style.display = 'none';

            var selected = [];
            document.querySelectorAll('#cleanup-items input:checked').forEach(function(cb) {
                selected.push(cb.id.replace('cln-', ''));
            });

            var data = await fetchJSON(API + '/cleanup/run', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ items: selected.length > 0 ? selected : null })
            });

            btn.disabled = false;
            btn.textContent = 'Run Cleanup';

            if (data && data.total_freed > 0) {
                result.className = 'cleanup-result success';
                result.innerHTML = '&#10003; Freed <b>' + data.total_freed_str + '</b>' +
                    '<div style="margin-top:6px;font-size:11px;color:var(--text-secondary)">' +
                    data.items.filter(function(i) { return i.success; }).map(function(i) { return i.name + ' (+' + i.freed_str + ')'; }).join(' &middot; ') +
                    '</div>';
            } else if (data) {
                result.className = 'cleanup-result success';
                result.innerHTML = '&#10003; Nothing to clean &mdash; all clear!';
            } else {
                result.className = 'cleanup-result error';
                result.innerHTML = '&#10007; Cleanup failed. Check server logs.';
            }
        }

        // ── File Manager ──

        function fmtDate(ts) {
            if (!ts) return '-';
            var d = new Date(ts * 1000);
            return d.getFullYear().toString().slice(2) + '/' +
                ('0' + (d.getMonth() + 1)).slice(-2) + '/' +
                ('0' + d.getDate()).slice(-2) + ' ' +
                ('0' + d.getHours()).slice(-2) + ':' +
                ('0' + d.getMinutes()).slice(-2);
        }

        async function loadFiles(path) {
            var list = document.getElementById('file-list');
            if (!list) return;
            list.innerHTML = '<div class="file-empty">Loading...</div>';
            try {
                var r = await fetch(API + '/files/list?path=' + encodeURIComponent(path),
                    AUTH_TOKEN ? {headers: {'X-Auth-Token': AUTH_TOKEN}} : {});
                var data = await r.json();
                currentPath = data.path;
                var input = document.getElementById('file-path');
                if (input) input.value = data.path;

                if (!data.items || data.items.length === 0) {
                    list.innerHTML = '<div class="file-empty">Empty directory</div>';
                    return;
                }
                list.innerHTML = '';
                data.items.forEach(function(f) {
                    var row = document.createElement('div');
                    row.className = 'file-item';
                    var icon = f.type === 'dir' ? '&#128193;' : '&#128196;';
                    row.innerHTML =
                        '<span class="icon">' + icon + '</span>' +
                        '<span class="name">' + f.name + (f.type === 'dir' ? '/' : '') + '</span>' +
                        '<span class="size">' + f.size_str + '</span>' +
                        '<span class="date">' + fmtDate(f.mtime) + '</span>' +
                        '<button class="delete-btn" data-path="' + encodeURIComponent(data.path + '/' + f.name) + '">&times;</button>';

                    row.onclick = function(e) {
                        if (e.target.className === 'delete-btn') return;
                        if (f.type === 'dir') navigateTo(data.path + '/' + f.name);
                    };
                    list.appendChild(row);
                });

                list.querySelectorAll('.delete-btn').forEach(function(btn) {
                    btn.onclick = function(e) {
                        e.stopPropagation();
                        var p = decodeURIComponent(btn.getAttribute('data-path'));
                        deletePath(p);
                    };
                });
            } catch(e) {
                list.innerHTML = '<div class="file-empty">Failed to load: ' + e.message + '</div>';
            }
        }

        function navigateTo(path) { path = path || '/'; loadFiles(path); }
        function navigateUp() {
            var parent = currentPath.substring(0, currentPath.lastIndexOf('/'));
            if (!parent || parent === '') parent = '/';
            loadFiles(parent);
        }
        function reloadFiles() { loadFiles(currentPath); }

        async function deletePath(path) {
            if (!confirm('Delete ' + path + '?')) return;
            var opts = {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({path: path})
            };
            if (AUTH_TOKEN) opts.headers['X-Auth-Token'] = AUTH_TOKEN;
            try {
                var r = await fetch(API + '/files/delete', opts);
                var data = await r.json();
                if (data.success) reloadFiles();
                else alert('Delete failed: ' + (data.error || 'Unknown error'));
            } catch(e) { alert('Delete failed: ' + e.message); }
        }

        // ── Terminal ──

        var term = null;
        var termSocket = null;
        var resizeSocket = null;

        function initTerminal() {
            if (term) { term.focus(); return; }
            var container = document.getElementById('terminal-container');
            if (!container) return;

            term = new Terminal({
                cursorBlink: true,
                cursorStyle: 'bar',
                fontSize: 14,
                fontFamily: "'Cascadia Code', 'Fira Code', 'JetBrains Mono', 'Consolas', monospace",
                theme: {
                    background: '#0a0a0a',
                    foreground: '#e4e8f1',
                    cursor: '#10b981',
                    selectionBackground: 'rgba(16,185,129,0.3)',
                    black: '#1a1f2e', red: '#ef4444', green: '#10b981', yellow: '#f59e0b',
                    blue: '#3b82f6', magenta: '#a855f7', cyan: '#06b6d4', white: '#e4e8f1',
                    brightBlack: '#475569', brightRed: '#f87171', brightGreen: '#34d399',
                    brightYellow: '#fbbf24', brightBlue: '#60a5fa', brightMagenta: '#c084fc',
                    brightCyan: '#22d3ee', brightWhite: '#f8fafc'
                },
                allowProposedApi: true,
                scrollback: 5000
            });

            var fitAddon = new FitAddon.FitAddon();
            var webLinksAddon = new WebLinksAddon.WebLinksAddon();
            term.loadAddon(fitAddon);
            term.loadAddon(webLinksAddon);
            term.open(container);
            fitAddon.fit();

            var ro = new ResizeObserver(function() {
                try { fitAddon.fit(); } catch(e) {}
                resizePty();
            });
            ro.observe(container);

            var proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            var wsUrl = proto + '//' + window.location.host + '/ws/terminal';
            if (AUTH_TOKEN) {
                wsUrl += '?token=' + encodeURIComponent(AUTH_TOKEN);
            }

            termSocket = new WebSocket(wsUrl);
            termSocket.binaryType = 'arraybuffer';
            termSocket.onopen = function() {
                term.write('\r\n\x1b[32mConnected to server\x1b[0m\r\n\r\n');
                term.focus();
                resizePty();
            };
            termSocket.onmessage = function(e) { if (term) term.write(new Uint8Array(e.data)); };
            termSocket.onclose = function() { if (term) term.write('\r\n\x1b[33mDisconnected\x1b[0m\r\n'); };
            termSocket.onerror = function() { if (term) term.write('\r\n\x1b[31mConnection error\x1b[0m\r\n'); };
            term.onData(function(data) {
                if (termSocket && termSocket.readyState === WebSocket.OPEN) termSocket.send(data);
            });

            var resizeWsUrl = proto + '//' + window.location.host + '/ws/terminal/resize';
            resizeSocket = new WebSocket(resizeWsUrl);
            function resizePty() {
                if (term && resizeSocket && resizeSocket.readyState === WebSocket.OPEN) {
                    resizeSocket.send(JSON.stringify({ cols: term.cols, rows: term.rows }));
                }
            }
            term.onResize(function() { resizePty(); });
        }

        // ── Poll loop ──

        async function poll() {
            var m = await fetchJSON(API + '/metrics');
            if (!m) return;
            updateHistory(m, false);
            updateCharts();
            var cpuEl = document.querySelector('#stat-cpu .stat-value');
            var ramEl = document.querySelector('#stat-ram .stat-value');
            if (cpuEl) cpuEl.textContent = fmt(m.cpu) + '%';
            if (ramEl) ramEl.textContent = fmt(m.ram.percent) + '%';
            var load1m = document.getElementById('load-1m');
            if (load1m && m.load) {
                load1m.textContent = fmt(m.load['1min'], 2);
                var loadDiv = load1m.parentElement.querySelector('div:last-child');
                if (loadDiv) loadDiv.innerHTML = '5min: ' + fmt(m.load['5min'], 2) + ' &middot; 15min: ' + fmt(m.load['15min'], 2);
            }
            // Update process table
            var procBody = document.getElementById('proc-body');
            if (procBody && m.top_processes) {
                procBody.innerHTML = '';
                m.top_processes.slice(0, 12).forEach(function(p) {
                    var tr = document.createElement('tr');
                    tr.innerHTML = '<td>' + p.pid + '</td><td>' + escHtml(p.name) + '</td><td>' + fmt(p.cpu, 1) + '%</td><td>' + fmt(p.mem, 1) + '%</td>' +
                        '<td><button class="kill-btn" onclick="killProcess(' + p.pid + ',this)" title="Kill process">&#10005;</button></td>';
                    procBody.appendChild(tr);
                });
            }
        }

        checkAuth().then(function() {
            setInterval(poll, CONFIG.interval);
        });
    </script>
</body>
